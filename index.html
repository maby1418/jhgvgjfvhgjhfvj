<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

</head>

<body>
    <header>
        
        <h1>Noruega vence a copa do mundo</h1>
        <p>Noruega vence o Brasil com 10 gols</p>
        <style>
            header {
                background-color: #183C63;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                
                              }

            main {
                background-color: #FFFFFF;
                color: #046912;

            }

            article {
                display: flex;
            }

            img {
                width: 80px;
                height: 80px;
            }

            .artigo-autor {
                font-weight: bold;
            }
         
        </style>
    </header>

    <main>
        <article>
            <img src="ovo.webp"
                alt="Logotipo conceitual de tecnologia e educacao: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">

            <div>
                <h2>como noruega venceu o brasil </h2>
                <p class="artigo-autor">Por: jaredy</p>
                <p>Haaland faz 5 gols e com ajuda do seu time, fizeram os outros 5 </p>
                <button>❤️<span>2k</span></button>
                <button>👍<span>1k</span></button>
            </div>
        </article>
        <article>
            <img src="minion.jpeg"
                alt="Logotipo conceitual de tecnologia e educacao: um livro aberto de onde emerge um cérebro digital brilhante, cercado por ícones de Wi-Fi, circuitos e lâmpada de ideia. Cores em tons de azul e branco.">

            <div>
                <h2>os dinossauros surgem na mata atlantica</h2>
                <p class="artigo-autor">Por: Marcelo Paludetto</p>
                <p>trex aparece na amazonia comendo um jacare.</p>
                <button>❤️<span>2k</span></button>
                <button>👍<span>1k</span></button>
            </div>
        </article>

    </main>
</body>

<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    });



</script>

</html>
